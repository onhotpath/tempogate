{{define "base" -}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{block "title" .}}Device verification{{end}}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, sans-serif; max-width: 480px; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { margin: 0.75rem 0; }
    .user-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 2.5rem; letter-spacing: 0.15em; font-weight: 600; margin: 1.5rem 0; padding: 1rem 1.25rem; border: 2px solid #888; border-radius: 6px; text-align: center; }
    .actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
    .actions form { flex: 1; }
    button { width: 100%; padding: 0.75rem 1rem; font-size: 1rem; border: 1px solid #888; border-radius: 6px; cursor: pointer; }
    button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
    button.danger { background: transparent; color: #b62024; border-color: #b62024; }
    input[type=text] { width: 100%; padding: 0.75rem; font-size: 1.25rem; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid #888; border-radius: 6px; box-sizing: border-box; }
    .muted { color: #666; font-size: 0.9rem; }
    .warn { background: #fff8e1; border-left: 4px solid #f0b400; padding: 0.5rem 0.75rem; margin: 1rem 0; }
  </style>
</head>
<body>
  <main>
    {{block "content" .}}{{end}}
  </main>
</body>
</html>
{{- end}}
