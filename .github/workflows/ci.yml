name: ci

on:
  push:
    branches: [main]
    # Merging the generated Homebrew cask PR touches only Casks/** and must
    # not spawn a no-op CI run. PRs are unaffected (paths-ignore is push-only).
    paths-ignore: ['Casks/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: check + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # Keyed on go.mod too: tools are built with the module's toolchain, so a
      # Go bump must rebuild them (an older-Go govulncheck cannot load newer
      # sources).
      - name: Cache .bin tools
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .bin
          key: ${{ runner.os }}-tempogate-tools-${{ hashFiles('Makefile', 'go.mod') }}

      - name: Install pinned tools
        run: make tools

      - name: Run CI (check + lint + vuln + supply-chain pins + test-run)
        run: make ci

      # Rot guard: the distributed CLI is built with -tags lean and must not
      # link the heavy server/state subtree — the SQLite engine (modernc
      # sqlite/libc, ~5 MB) or the api/state-store packages. (The CLI is an
      # OIDC client, so the pure-Go oidc/keys/jwx packages are expected and
      # fine.) Deterministic via the import graph, so it can't be masked by
      # dead-code elimination. Fails loudly if a server import leaks in.
      - name: Lean CLI build guard (no server subtree)
        run: |
          go build -tags lean -o /dev/null .
          leaked=$(go list -tags lean -deps . \
            | grep -E '^github\.com/onhotpath/tempogate/(api|state/sqlite|cmd/servercmd)$|^modernc\.org/(sqlite|libc)' || true)
          if [ -n "$leaked" ]; then
            echo "server packages leaked into the lean CLI:"; echo "$leaked"; exit 1
          fi
          echo "lean import graph clean (no api / state/sqlite / servercmd / modernc sqlite|libc)"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
        continue-on-error: true
