name: retag image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version with v prefix, such as v0.1.0'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy the unprefixed image tag
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'version must be a stable vX.Y.Z tag' >&2
            exit 1
          fi

          source="${IMAGE}:${VERSION#v}"
          target="${IMAGE}:${VERSION}"
          if docker buildx imagetools inspect "$target" >/dev/null 2>&1; then
            echo "$target already exists" >&2
            exit 1
          fi

          source_digest=$(docker buildx imagetools inspect "$source" --format '{{.Manifest.Digest}}')
          docker buildx imagetools create --tag "$target" "$source"
          target_digest=$(docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}')
          test "$source_digest" = "$target_digest"
