# Default values for tempogate.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# tempogate's default state store is SQLite on a single ReadWriteOnce PVC,
# and SQLite tolerates exactly one writer process. Running more than one
# replica would corrupt state. Horizontal scaling needs a shared backend
# (planned upstream); until then this MUST stay 1 and `autoscaling` MUST
# stay disabled. The Deployment uses the Recreate strategy for the same
# reason: two pods cannot hold the PVC writer at once. The chart refuses
# to render with replicaCount > 1 or autoscaling.enabled=true.
replicaCount: 1

image:
  repository: ghcr.io/onhotpath/tempogate
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion when empty.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # tempogate never calls the Kubernetes API, so no token is mounted. Applied
  # to the ServiceAccount and the pod spec.
  automount: false
  annotations: {}
  # Generated from the fullname template when empty and create is true.
  name: ""

podAnnotations: {}
podLabels: {}

# The distroless `nonroot` user/group is uid/gid 65532. fsGroup makes the
# mounted state PVC group-writable so the SQLite file can be created.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  # The public listener: the OIDC/OAuth2 surface together with /healthz and
  # /readyz. Ingress and HTTPRoute route here only.
  port: 8000
  # Optional in-cluster Service for the admin API (/admin/keys). Disabled by
  # default: the admin listener then stays on the pod's loopback
  # (127.0.0.1:8081), reachable only via `kubectl port-forward`. Enabling it
  # binds the admin listener on all pod interfaces and adds a separate
  # `<fullname>-admin` Service that no Ingress/HTTPRoute points at. It
  # requires admin.tokenSha256SecretRef.
  admin:
    enabled: false
    type: ClusterIP
    port: 8081

# HTTP_LISTENER bind address. The binary defaults to 127.0.0.1, which is
# unreachable through a Service; in-cluster it MUST bind all interfaces.
listenAddress: 0.0.0.0

# HTTP_TRUSTED_PROXIES: CIDRs (or addresses) of the reverse proxies in front
# of tempogate, e.g. your ingress controller's pod CIDR. tempogate rate-limits
# its public endpoints per client address; it reads that address from
# X-Forwarded-For only when the connection comes from one of these. Empty
# trusts no proxy, so behind an ingress every client shares the ingress's
# budget. Never list a range clients can connect from directly.
trustedProxies: []
  # - 10.0.0.0/8

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: tempogate.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: tempogate-tls
    #   hosts:
    #     - tempogate.example.com

# Gateway API alternative to ingress. Disabled by default; requires Gateway
# API CRDs and a controller (https://gateway-api.sigs.k8s.io/guides/).
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - tempogate.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 5
# Guards a slow first boot (keypair bootstrap on an empty state store)
# without making the liveness probe lenient.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 3
  failureThreshold: 20

# Not supported: see the replicaCount comment for why tempogate cannot be
# scaled horizontally yet. The chart ships no HorizontalPodAutoscaler and
# refuses to render with enabled=true.
autoscaling:
  enabled: false

# Persistent volume for the SQLite state store: the signing keypair, auth
# codes, and refresh tokens. Losing it rotates signing keys and invalidates
# every issued refresh token, so back it with durable storage in production.
persistence:
  enabled: true
  # Bind an existing PVC instead of creating one. When set, size /
  # storageClass / accessMode below are ignored.
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  annotations: {}

# Where tempogate keeps its SQLite database. sqlitePath MUST live under
# mountPath so the database lands on the PVC above.
state:
  mountPath: /var/lib/tempogate
  sqlitePath: /var/lib/tempogate/state.db

log:
  level: info

keys:
  # KEYS_ENCRYPTION_KEY - base64-encoded 32-byte key-encryption key. When
  # set, the private signing key is stored AES-256-GCM encrypted on the PVC
  # instead of as plain PEM, so a PVC snapshot or backup alone cannot mint
  # tokens. Supply it via an existing Secret you create out of band, and keep
  # that Secret out of the PVC's backups; generate the value once with:
  #   openssl rand -base64 32
  # Once a key is encrypted the Deployment refuses to boot without this
  # value. Keys stored before it was set keep working; encrypt them with
  #   kubectl exec deploy/<release>-tempogate -- /tempogate keys encrypt
  # See docs/hardening.md#signing-key-encryption.
  encryptionKeySecretRef:
    name: ""
    key: ""

oidc:
  # Externally reachable base URL of this server. Advertised as `issuer`
  # and used to derive jwks_uri in the discovery document, e.g.
  # https://tempogate.example.com
  #
  # May include a path to share a hostname with another app (sub-path
  # hosting), e.g. https://tempogate.example.com/idp — the whole OIDC surface
  # then serves under that prefix. /healthz and /readyz stay at the root
  # regardless, so the probe paths below need no change.
  issuer: ""

  # OIDC_ALLOW_INSECURE_ISSUER - development only. `serve` refuses to start
  # when `issuer` is plain http on a non-loopback host, because relying
  # parties would then fetch the discovery document and signing keys over an
  # unauthenticated channel. Set true only for a throwaway cluster without
  # TLS.
  allowInsecureIssuer: false

  # OIDC_SESSION_SIGNING_KEY — base64url-encoded 32-byte HMAC key.
  # Signs the verification-page session cookie and the SSO-bounce `state`
  # used by the device-authorization flow (RFC 8628), see
  # docs/cli-device-login.md. The `tempogate serve` Deployment REFUSES
  # TO BOOT if this is empty, not base64url, or does not decode to
  # exactly 32 bytes — set this before upgrading or the Deployment will
  # crash-loop. The migrate initContainer does not need it: `tempogate
  # migrate` builds only the SQLite store and never receives secrets.
  # Supply it via an existing Secret you create out of band; generate the
  # value once with:
  #   openssl rand -base64 32 | tr '+/' '-_' | tr -d '='
  # The key MUST stay stable across rolling restarts: rotating it
  # invalidates every active approval session.
  sessionSigningKeySecretRef:
    name: ""
    key: ""

  # OIDC_SESSION_TTL — TTL of the verification-page session cookie used
  # by the device-authorization flow. Go duration. Empty leaves the
  # tempogate binary's built-in default (5m). The cookie is scoped to
  # the device-flow UI only — not a general-purpose login session — so
  # short values bound how long an approval window can stay open.
  sessionTtl: ""

auth:
  # Comma-separated `id:redirect_uri` client allowlist (OIDC_CLIENTS) of
  # exact redirect URIs, e.g.
  # "temporal-ui:https://temporal.example.com/auth/sso/callback,tempogate-cli:http://127.0.0.1/callback,tempogate-device:"
  # Loopback http://127.0.0.1/<path> entries match any port; an empty value
  # registers a device-only client. Non-secret.
  clients: ""
  # OIDC_ALLOW_INSECURE_REDIRECT_URIS. Dev only: allow plain-http,
  # non-loopback redirect URIs in `clients`. Keep false in production.
  allowInsecureRedirectUris: false
  # Email domains permitted to complete SSO. Empty ⇒ nobody is admitted.
  allowedDomains: []
  # OIDC_ALLOWED_HOSTED_DOMAINS ("Workspace mode"). Google Workspace domains
  # whose `hd` claim Google's id_token must carry, on top of allowedDomains.
  # Recommended for Workspace organizations; empty keeps the email-domain
  # gate only (tempogate logs a warning).
  allowedHostedDomains: []
  # Optional confidential-client carve-out (OIDC_CLIENT_SECRETS) — secret
  # material. Supply it via an existing Secret, never as plaintext here.
  clientSecretsSecretRef:
    name: ""
    key: ""
  upstream:
    google:
      # Upstream Google OAuth2 client. clientId and clientSecret are read
      # from existing Secrets you create out of band.
      clientIdSecretRef:
        name: ""
        key: ""
      clientSecretSecretRef:
        name: ""
        key: ""
      # Endpoint overrides for testing against a mock IdP. Leave blank to
      # use Google's real endpoints (baked into the binary).
      authEndpoint: ""
      tokenEndpoint: ""
      issuerUrl: ""

# Which Temporal permissions each signed-in person's access token carries
# (see docs/authorization.md#authorization). Deny by default: a person no rule
# matches gets defaultPermissions, and with none of those no token at all.
# tempogate refuses to start when both are empty.
authz:
  # OIDC_AUTHZ_RULES_<n>: "<selector>=<namespace>:<role>[,...]" where the
  # selector is email:<address> or domain:<email domain> (case-insensitive)
  # and the role is read, write or admin. Every matching rule applies; a
  # namespace named twice keeps the higher role. temporal-system:<role>
  # grants that role on every namespace. Non-secret. E.g.
  #   - "email:alice@example.com=temporal-system:admin"
  #   - "domain:example.com=orders:read,payments:read"
  rules: []
  # OIDC_AUTHZ_DEFAULT_PERMISSIONS: comma-separated permissions for admitted
  # people no rule matches. "temporal-system:admin" keeps the behaviour of
  # releases without rules (every admitted user is cluster admin) and is
  # logged as a warning at startup.
  defaultPermissions: ""

# Admin API authentication (see docs/configuration.md#admin-api). Applies
# whether or not service.admin is enabled.
admin:
  # ADMIN_TOKEN_SHA256: comma-separated hex SHA-256 digests of the accepted
  # admin bearer tokens. Supply it via an existing Secret; generate with:
  #   token=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')
  #   printf %s "$token" | sha256sum | cut -d' ' -f1
  # Unset leaves the admin API locked: every route but /admin/healthz
  # answers 401.
  tokenSha256SecretRef:
    name: ""
    key: ""
  # ADMIN_ALLOWED_HOSTS: Host header values the admin API accepts; an entry
  # without a port matches any port. Empty: with service.admin enabled the
  # chart allows the admin Service's DNS names on service.admin.port plus
  # loopback names on any port (kubectl port-forward); otherwise the binary
  # default (loopback on 8081) applies.
  allowedHosts: []
  # ADMIN_ALLOW_SYSTEM_GRANTS: allow minting cluster-wide temporal-system
  # keys. Leave false except while minting such a key.
  allowSystemGrants: false
  # ADMIN_KEYS_MAX_TTL (cap on a key's expires_at, default 2160h),
  # KEYS_RETIREMENT_GRACE (4h), KEYS_RELOAD_INTERVAL (30s) and
  # KEYS_PUBLISH_DELAY (5m; must exceed Temporal's JWKS refreshInterval plus
  # KEYS_RELOAD_INTERVAL) keep their binary defaults; override them through
  # extraEnv.

# Extra environment variables appended verbatim to the serve container and
# the migrate initContainer, e.g.
# [{name: STATE_SQLITE_BUSY_TIMEOUT, value: "10s"}].
extraEnv: []

# Extra volumes / mounts on the Deployment (the state PVC is wired
# automatically from `persistence`).
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
