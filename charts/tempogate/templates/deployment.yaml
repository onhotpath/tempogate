{{- include "tempogate.validateValues" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tempogate.fullname" . }}
  labels:
    {{- include "tempogate.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # SQLite tolerates one writer; a rolling update would briefly run two
  # pods contending for the same PVC. Recreate stops the old pod first,
  # which is also what makes the migrate initContainer below race-free.
  # Postgres replicas share the database, so they roll (see
  # updateStrategy in values.yaml).
  strategy:
    {{- if .Values.updateStrategy }}
    {{- toYaml .Values.updateStrategy | nindent 4 }}
    {{- else if include "tempogate.postgres" . }}
    type: RollingUpdate
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "tempogate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tempogate.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tempogate.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # `tempogate migrate` runs before `serve`, in the same pod. On SQLite,
      # with one replica and the Recreate strategy, the previous pod has
      # exited before this one starts, so the migration never races a
      # running server and never needs a second ReadWriteOnce attachment.
      # On Postgres every pod runs it; concurrent runs serialize on an
      # advisory lock and apply each version once.
      initContainers:
        - name: migrate
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          # Same non-secret config and extraEnv as `serve`, so an operator
          # override (e.g. STATE_SQLITE_BUSY_TIMEOUT) applies to both. No
          # secret env: migrate builds only the state store, and reads the
          # Postgres DSN from its mounted file.
          envFrom:
            - configMapRef:
                name: {{ include "tempogate.configMapName" . }}
          {{- $extraEnv := include "tempogate.extraEnv" . | trim }}
          {{- if $extraEnv }}
          env:
            {{- $extraEnv | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "tempogate.volumeMounts" . | trim | nindent 12 }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.service.admin.enabled }}
            - name: admin
              containerPort: {{ .Values.service.admin.port }}
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "tempogate.configMapName" . }}
          {{- $env := printf "%s\n%s" (include "tempogate.secretEnv" . | trim) (include "tempogate.extraEnv" . | trim) | trim }}
          {{- if $env }}
          env:
            {{- $env | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "tempogate.volumeMounts" . | trim | nindent 12 }}
      volumes:
        {{- if include "tempogate.postgres" . }}
        - name: postgres-dsn
          secret:
            secretName: {{ .Values.state.postgres.dsnSecretRef.name }}
            items:
              - key: {{ required "state.postgres.dsnSecretRef.key is required when .name is set" .Values.state.postgres.dsnSecretRef.key }}
                path: dsn
            defaultMode: 0440
        {{- else }}
        - name: state
          {{- if or .Values.persistence.enabled .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ include "tempogate.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
