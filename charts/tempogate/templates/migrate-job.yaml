{{- if or .Values.persistence.enabled .Values.persistence.existingClaim }}
apiVersion: batch/v1
kind: Job
metadata:
  # Release revision in the name so every `helm upgrade` gets a fresh Job
  # — Job pod templates are immutable, so a fixed-name Job would fail to
  # update when the image tag changes. Helm prunes the previous revision's
  # Job (it leaves the manifest); ttlSecondsAfterFinished is the backstop.
  name: {{ printf "%s-migrate-%d" (include "tempogate.fullname" .) (.Release.Revision | int) }}
  labels:
    {{- include "tempogate.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "tempogate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # `tempogate migrate` only touches the local SQLite file and never
      # calls the Kubernetes API: run it under the namespace `default`
      # ServiceAccount with no mounted token (least privilege).
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          env:
            - name: LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: STATE_SQLITE_PATH
              value: {{ .Values.state.sqlitePath | quote }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: state
              mountPath: {{ .Values.state.mountPath }}
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "tempogate.pvcName" . }}
{{- end }}
