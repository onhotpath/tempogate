apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "tempogate.fullname" . }}-test-connection"
  labels:
    {{- include "tempogate.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      # Pinned by digest (multi-arch index) so `helm test` cannot pull a
      # moved tag; bump both together.
      image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command: ['wget']
      args:
        - '-q'
        - '-O-'
        - 'http://{{ include "tempogate.fullname" . }}:{{ .Values.service.port }}/healthz'
  restartPolicy: Never
