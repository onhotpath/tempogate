apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "tempogate.fullname" . }}-test-connection"
  labels:
    {{- include "tempogate.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      # Pinned by digest (multi-arch index) so `helm test` cannot pull a
      # moved tag; bump both together.
      image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command: ['/bin/sh', '-ec']
      args:
        - |
          base={{ printf "http://%s:%v" (include "tempogate.fullname" .) .Values.service.port | quote }}
          prefix={{ (urlParse .Values.oidc.issuer).path | default "" | trimSuffix "/" | quote }}
          wget -q -O- "$base/healthz"
          wget -q -O- "$base/readyz"
          discovery=$(wget -q -O- "$base$prefix/.well-known/openid-configuration")
          printf '%s' "$discovery" | grep -q '"issuer"'
          printf '%s' "$discovery" | grep -q '"jwks_uri"'
          jwks=$(wget -q -O- "$base$prefix/.well-known/jwks.json")
          printf '%s' "$jwks" | grep -q '"kid"'
          printf '%s' "$jwks" | grep -q '"n"'
  restartPolicy: Never
