# Helm values overlay for a local kind / k3d cluster.
#
#   kind create cluster
#   kubectl create secret generic tempogate-kind \
#     --from-literal=session-signing-key="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')" \
#     --from-literal=client-secrets="tempogate-device-ui:$(openssl rand -hex 32)"
#   helm install tempogate ./charts/tempogate --values examples/kind/values.yaml
#   kubectl rollout status deploy/tempogate
#   kubectl port-forward svc/tempogate 8000:8000 &
#   curl -fsS http://127.0.0.1:8000/healthz
#
# This overlay only proves the server boots, migrates, and serves /healthz.
# Wiring real Google SSO + a Temporal stack is covered by the docker-compose
# example and docs/getting-started.md.

# Smaller footprint for a laptop cluster.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# Use the cluster's default StorageClass (kind ships `standard`, a
# local-path provisioner). 1Gi is plenty for the SQLite state store.
persistence:
  enabled: true
  size: 1Gi
  storageClass: ""

log:
  level: debug

# Reachable over `kubectl port-forward` on the host. Replace with your real
# external URL when fronting this with an Ingress.
#
# `serve` refuses to boot without a session signing key and the internal
# tempogate-device-ui client (with its secret). bootstrap.sh creates the
# `tempogate-kind` Secret both refs point at, with demo-only random values.
oidc:
  issuer: http://127.0.0.1:8000
  sessionSigningKeySecretRef:
    name: tempogate-kind
    key: session-signing-key

# serve refuses to start without authorization. Replace this rule with your
# own: "<email:address|domain:domain>=<namespace>:<role>[,...]", roles read,
# write or admin, temporal-system for every namespace. See
# docs/configuration.md#authorization.
authz:
  rules:
    - "email:alice@example.com=default:write"

# No upstream Google client is configured, so the SSO flow is not exercised
# by this smoke overlay.
auth:
  clients: tempogate-device-ui:http://127.0.0.1/device/sso-callback
  clientSecretsSecretRef:
    name: tempogate-kind
    key: client-secrets
