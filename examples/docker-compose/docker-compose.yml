# DEV ONLY - NEVER EXPOSE THIS STACK. The bundled mock IdP signs in anyone who
# can reach it as ANY identity, and the demo identity gets full Temporal access.
# Every port is published on 127.0.0.1 only; keep it that way. Secrets have no
# defaults: generate them first with `./gen-env.sh > .env` (see README.md).
#
# A complete, self-contained tempogate demo: a Temporal cluster whose Web UI
# does OIDC SSO through tempogate, and whose gRPC frontend verifies the JWTs
# tempogate mints against tempogate's JWKS. The upstream IdP is a bundled
# mock, so `docker compose up` proves the whole chain with zero external
# accounts.
#
# This is the interactive twin of test/e2e/web_ui_sso_test.go — same images,
# same env wiring. That test is the source of truth; if Temporal's auto-setup
# auth templating ever changes, reconcile here against it.
#
# Hostnames (tempogate / temporal-ui / mockoidc) must resolve to the SAME
# place from your host browser AND between containers, because each appears
# in both a browser redirect and a server-to-server call. The portable way
# is one /etc/hosts line mapping them to 127.0.0.1 (see README.md). On Linux
# you can instead skip that edit with docker-compose.host-network.yml.

name: tempogate-example

services:
  # Stand-in upstream IdP (a real, tiny OIDC server — see Dockerfile.mockoidc).
  # Plays the role Google plays in a real deployment.
  mockoidc:
    build:
      context: ../..
      dockerfile: examples/docker-compose/Dockerfile.mockoidc
    environment:
      # 8082, not 8081: under docker-compose.host-network.yml every service
      # shares the host's ports, and 8081 is tempogate's admin listener.
      MOCK_LISTEN: ":8082"
      # Must equal tempogate's OIDC_GOOGLE_ISSUER_URL: it is the `iss` the
      # mock stamps into the id_token and the base tempogate runs OIDC
      # discovery against. The name resolves to this container in-network and
      # to 127.0.0.1 on your host (the consent screen is browser-facing).
      MOCK_ISSUER: "http://mockoidc:8082"
      # The identity the one-click consent screen asserts. Its domain must be
      # in TEMPOGATE_ALLOWED_DOMAINS or tempogate's callback returns 403.
      MOCK_EMAIL: "${DEMO_EMAIL:-alice@example.com}"
      # The Google Workspace hosted domain (`hd` claim) the mock asserts. It
      # must be in TEMPOGATE_ALLOWED_HOSTED_DOMAINS; set it empty to see a
      # consumer Google account for the same address get a 403.
      MOCK_HD: "${DEMO_HD-example.com}"
    ports:
      - "127.0.0.1:8082:8082"

  # One-shot schema migration. `serve` refuses to run against a stale store,
  # so this must finish first; the two share the state volume.
  tempogate-migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    # Or pin a published image instead of building from source:
    # image: ghcr.io/onhotpath/tempogate:latest
    command: ["migrate"]
    # Named volumes are root-owned; the distroless image runs as nonroot and
    # could not create the SQLite file. Running as root here (and in serve)
    # is what the e2e test does for the same reason — demo only.
    user: "0:0"
    environment:
      STATE_SQLITE_PATH: /state/state.db
      OIDC_ISSUER: "http://tempogate:8000"
    volumes:
      - tempogate-state:/state

  tempogate:
    build:
      context: ../..
      dockerfile: Dockerfile
    # image: ghcr.io/onhotpath/tempogate:latest
    command: ["serve"]
    user: "0:0"
    environment:
      HTTP_LISTENER: "0.0.0.0:8000"
      STATE_SQLITE_PATH: /state/state.db
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      # Externally reachable base URL — advertised as `issuer`, derives
      # jwks_uri. Same string on host and in-network (see header comment).
      OIDC_ISSUER: "http://tempogate:8000"
      # serve refuses a plain-http issuer on a non-loopback host; this demo
      # has no TLS, so opt in explicitly. Never set this in production.
      OIDC_ALLOW_INSECURE_ISSUER: "true"
      # Four registered clients:
      #   - temporal-ui            (confidential, see CLIENT_SECRETS): Web UI SSO.
      #   - tempogate-cli          (public, PKCE):                     loopback `tempogate login`;
      #                             http://127.0.0.1/callback matches any port.
      #   - tempogate-device       (public, device-only, empty value): CLI side of
      #                             `tempogate login --device` - see docs/cli-device-login.md.
      #   - tempogate-device-ui    (confidential, see CLIENT_SECRETS): tempogate's own
      #                             verification page bouncing through Google SSO.
      # Each value is an exact redirect URI (docs/configuration.md#redirect-uri-registration).
      OIDC_CLIENTS: "temporal-ui:http://temporal-ui:8080/auth/sso/callback,tempogate-cli:http://127.0.0.1/callback,tempogate-device:,tempogate-device-ui:http://tempogate:8000/device/sso-callback"
      # The in-network hosts above are plain http. Dev only: never set this in production.
      OIDC_ALLOW_INSECURE_REDIRECT_URIS: "true"
      OIDC_CLIENT_SECRETS: "temporal-ui:${TEMPORAL_UI_CLIENT_SECRET:?run ./gen-env.sh > .env},tempogate-device-ui:${TEMPOGATE_DEVICE_UI_CLIENT_SECRET:?run ./gen-env.sh > .env}"
      # Device flow: HMAC key signing the short-lived verification-page session
      # cookie. Base64url-encoded 32-byte randomness, generated by gen-env.sh
      # (`openssl rand -base64 32 | tr '+/' '-_' | tr -d '='`). In real
      # deployments supply it via a Secret. Must be stable across rolling restarts.
      # With this plain-http issuer the cookie is not marked Secure; an https
      # OIDC_ISSUER (any real deployment) makes it Secure automatically.
      OIDC_SESSION_SIGNING_KEY: "${TEMPOGATE_SESSION_SIGNING_KEY:?run ./gen-env.sh > .env}"
      # Optional: base64 32-byte key that encrypts the signing key stored in
      # the state volume. Unset (plain PEM) by default for the demo; in real
      # deployments generate once with `openssl rand -base64 32`, supply via a
      # Secret, and keep it out of the volume's backups. Once set, tempogate
      # needs it to start. See docs/hardening.md#signing-key-encryption.
      KEYS_ENCRYPTION_KEY: "${TEMPOGATE_KEYS_ENCRYPTION_KEY:-}"
      OIDC_ALLOWED_DOMAINS: "${TEMPOGATE_ALLOWED_DOMAINS:-example.com}"
      # Authorization: which Temporal permissions each signed-in person gets.
      # Deny by default, so this demo grants its one identity cluster admin
      # with an explicit rule (the Web UI's namespace list needs a
      # temporal-system grant). Add more indexed rules to grant others, e.g.
      #   OIDC_AUTHZ_RULES_1: "email:bob@example.com=default:read"
      #   OIDC_AUTHZ_RULES_2: "domain:example.com=default:write"
      # Anyone no rule matches is refused at sign-in (access_denied). See
      # docs/authorization.md#authorization.
      OIDC_AUTHZ_RULES_0: "email:${DEMO_EMAIL:-alice@example.com}=temporal-system:admin"
      # Workspace mode: Google's `hd` claim must also match. Recommended for
      # any Google Workspace organization.
      OIDC_ALLOWED_HOSTED_DOMAINS: "${TEMPOGATE_ALLOWED_HOSTED_DOMAINS:-example.com}"
      # Point tempogate's upstream Google client at the bundled mock.
      OIDC_GOOGLE_CLIENT_ID: "tempogate-upstream"
      # Not a secret: the mock never checks it.
      OIDC_GOOGLE_CLIENT_SECRET: "tempogate-upstream-secret"
      OIDC_GOOGLE_AUTH_ENDPOINT: "http://mockoidc:8082/auth"
      OIDC_GOOGLE_TOKEN_ENDPOINT: "http://mockoidc:8082/token"
      OIDC_GOOGLE_ISSUER_URL: "http://mockoidc:8082"
      # Browsable API docs at http://tempogate:8000/docs. Dev only: serve
      # refuses this unless OIDC_ISSUER is plain http, and never serves the
      # docs on the admin listener.
      API_DOCS_ENABLED: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      tempogate-migrate:
        condition: service_completed_successfully
      mockoidc:
        condition: service_started
    volumes:
      - tempogate-state:/state

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?run ./gen-env.sh > .env}"
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Temporal via auto-setup, with its STOCK JWT authorizer pointed at
  # tempogate's JWKS. test/e2e/web_ui_sso_test.go explains the internal-
  # frontend + explicit-SERVICES rationale; this demo diverges from it in
  # one deliberate way:
  #
  # The e2e test only does a token-bearing ListNamespaces, so it never needs
  # a provisioned `default` namespace and just SKIPs its creation. A browser
  # UI does need it. auto-setup runs ALL its provisioning (cluster health,
  # default namespace, search attributes) through TEMPORAL_ADDRESS — leave it
  # unset and it hits the external authorizing frontend (:7233) with no token,
  # so every call is "Request unauthorized" and `default` is never created.
  # Pointing it at the internal frontend (:7236) — auth-exempt by design,
  # which is exactly why USE_INTERNAL_FRONTEND is on — lets auto-setup
  # provision unauthenticated, while the external :7233 still enforces the
  # JWT for the actual SSO/CLI demo path.
  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: "${POSTGRES_PASSWORD:?run ./gen-env.sh > .env}"
      POSTGRES_SEEDS: db
      DBNAME: temporal
      BIND_ON_IP: 0.0.0.0
      USE_INTERNAL_FRONTEND: "true"
      # Provision over the auth-exempt internal frontend (see comment above).
      TEMPORAL_ADDRESS: "127.0.0.1:7236"
      SERVICES: "frontend:internal-frontend:history:matching:worker"
      TEMPORAL_JWT_KEY_SOURCE1: "http://tempogate:8000/.well-known/jwks.json"
      TEMPORAL_JWT_KEY_REFRESH: "10s"
      TEMPORAL_AUTH_AUTHORIZER: default
      TEMPORAL_AUTH_CLAIM_MAPPER: default
      # 1.25.2 has no audience check. On Temporal v1.29.0+ set
      # global.authorization.audience to tempogate's
      # OIDC_ACCESS_TOKEN_AUDIENCE ("temporal") in the server config; it is
      # not templated from an env var. See docs/configuration.md.
    ports:
      - "127.0.0.1:7233:7233"
    depends_on:
      db:
        condition: service_healthy
      tempogate:
        condition: service_started

  # Temporal Web UI, configured ONLY via stock TEMPORAL_AUTH_* env vars —
  # tempogate needs no Temporal-specific support code. The UI sends
  # tempogate's access token as its bearer; the ID token only proves the
  # login to the UI and grants nothing at Temporal.
  temporal-ui:
    image: temporalio/ui:2.32.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: "8080"
      TEMPORAL_AUTH_ENABLED: "true"
      TEMPORAL_AUTH_TYPE: oidc
      TEMPORAL_AUTH_PROVIDER_URL: "http://tempogate:8000"
      TEMPORAL_AUTH_ISSUER_URL: "http://tempogate:8000"
      TEMPORAL_AUTH_CLIENT_ID: temporal-ui
      TEMPORAL_AUTH_CLIENT_SECRET: "${TEMPORAL_UI_CLIENT_SECRET:?run ./gen-env.sh > .env}"
      TEMPORAL_AUTH_CALLBACK_URL: "http://temporal-ui:8080/auth/sso/callback"
      TEMPORAL_AUTH_SCOPES: "openid email"
      # Plain text only: the UI pastes it unquoted into its YAML config.
      TEMPORAL_BANNER_TEXT: "DEV ONLY tempogate demo. The mock IdP signs anyone in as anyone. Never expose this stack."
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      temporal:
        condition: service_started
      tempogate:
        condition: service_started

volumes:
  tempogate-state:
